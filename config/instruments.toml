# Instrument registry -- the single source of truth for every instrument.
#
# Each [[instrument]] is a logical exposure. `surfaces` controls where it
# shows up:
#   "research"  -> US-listed ticker, scanned/cached in the DuckDB price store
#   "web"       -> LSE-listed ETF surfaced on the public site
# An instrument may carry a research_ticker, a web_ticker, or both.
#
# Adding an instrument = add one block here. Then:
#   research -> python -m src.data.refresh --full --tickers <TICKER>
#   web      -> python scripts/site/build_data.py
#
# Loaded by src/data/registry.py with the stdlib tomllib (no dependency).

# ============================================================================
# Web surface -- LSE ETFs shown on the public site (scripts/site/build_data.py)
# ============================================================================

