name: Build & Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  schedule:
    # daily at 22:30 UTC — after US market close
    - cron: "30 22 * * 1-5"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install --quiet "yfinance>=0.2.40" "pandas>=2.0"

      - name: Build instrument data
        run: python scripts/site/build_data.py

      - name: Build portfolio data
        run: python scripts/site/build_portfolios.py

      - name: Validate generated data
        # Gate the deploy on data sanity: shape, finite/positive prices,
        # strictly-increasing dates, and menu <-> file consistency. The JSON is
        # built fresh in CI and never committed, so this is the only place it
        # can be checked before it reaches readers' browsers.
        run: python scripts/site/validate_data.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
