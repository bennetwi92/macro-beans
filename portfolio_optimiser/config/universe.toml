# ============================================================================
# Proxy series for covariance estimation.
# ----------------------------------------------------------------------------
# The bespoke / factor / young funds above have only a few years of GBP
# history. For a stable shrinkage covariance we splice each fund onto a
# longer-history proxy: we use the fund's own GBP returns where available and
# the proxy (converted to GBP if USD-denominated) for the earlier window.
#
#   source   yfinance ticker for the long-history series
#   ccy      "GBP" (use as-is) or "USD" (convert via GBPUSD=X)
#   note     what the proxy represents and any caveat
# ============================================================================

[proxy.AVWC]
source = "ACWI"
ccy = "USD"
note = "MSCI ACWI -- global-equity beta; understates the value/profitability tilt"

[proxy.AVSG]
source = "VBR"
ccy = "USD"
note = "US small-cap value (Vanguard); proxy for global small-cap value beta"

[proxy.XDEW]
source = "RSP"
ccy = "USD"
note = "Invesco S&P 500 Equal Weight (since 2003) -- direct equal-weight analogue"

[proxy.EMIM]
source = "EEM"
ccy = "USD"
note = "iShares MSCI EM -- EM-equity beta (IMI adds small caps)"

[proxy.IWQU]
source = "QUAL"
ccy = "USD"
note = "iShares MSCI USA Quality Factor -- quality-factor beta (US, since 2013)"

[proxy.MVOL]
source = "ACWV"
ccy = "USD"
note = "iShares MSCI ACWI Min Vol (since 2011) -- global min-vol analogue"

[proxy.JMFP]
source = "WTMF"
ccy = "GBP"
note = "WisdomTree Managed Futures (since 2011) -- trend/CTA beta. JMFP is GBP-HEDGED, so we use the USD proxy WITHOUT FX conversion (the hedge strips currency risk); converting would inject ~9% phantom FX vol."

[proxy.SGLN]
source = "GLD"
ccy = "USD"
note = "SPDR Gold (since 2004) -- gold price in GBP after FX conversion"

[proxy.IGLS]
source = "IGLS.L"
ccy = "GBP"
note = "Own GBP history (since 2009); short-duration gilts, low vol"

[proxy.ERNS]
source = "ERNS.L"
ccy = "GBP"
note = "Own GBP history; near-cash, minimal covariance contribution"

[proxy.DFND_EU]
source = "ITA"
ccy = "USD"
note = "US aerospace & defence -- defence-sector beta; OVERSTATES tech/US overlap (conservative for a crash-averse portfolio)"

[proxy.URNM]
source = "URA"
ccy = "USD"
note = "Global X Uranium (since 2010) -- uranium-miner beta"

[proxy.GLIN]
source = "IGF"
ccy = "USD"
note = "iShares Global Infrastructure (US line, since 2007)"

[proxy.UKEQ]
source = "ISF.L"
ccy = "GBP"
note = "iShares Core FTSE 100 (Dist, GBP, since 2009) -- same index as CUKX, exact analogue"

[proxy.EMVL]
source = "EEM"
ccy = "USD"
note = "iShares MSCI EM (since 2003) -- EM-equity beta; AVEM adds the value/profitability tilt"

[proxy.GRIDN]
source = "GRID"
ccy = "USD"
note = "First Trust NASDAQ Clean Edge Smart Grid (since 2009) -- grid/electrification beta"

[proxy.NUKE]
source = "NLR"
ccy = "USD"
note = "VanEck Uranium+Nuclear (US, since 2007) -- near-exact analogue of the NUCG index (miners + utilities + reactors)"

[proxy.JPNV]
source = "DXJ"
ccy = "GBP"
note = "WisdomTree Japan Hedged Equity (since 2006). IJPH is GBP-HEDGED, so we use the yen-hedged USD proxy WITHOUT FX conversion (both strip the currency), matching the JMFP treatment."

[proxy.SLVR]
source = "SLV"
ccy = "USD"
note = "iShares Silver Trust (since 2006) -- silver price in GBP after FX conversion"

[proxy.WATER]
source = "CGW"
ccy = "USD"
note = "Invesco S&P Global Water (US, since 2007) -- same S&P Global Water index family as IH2O; water utilities + infrastructure beta, GBP after FX conversion"
