# ============================================================================
# Instrument universe for the ISA + SIPP allocation optimiser.
# ============================================================================
#
# Single source of truth for the investable instruments. Every downstream
# module (data fetch, CMA build, covariance, optimiser, rebalancer, report)
# reads from here. Edit this file to add/remove an instrument or update a TER.
#
# Each [[instrument]] block:
#   key            stable internal id used everywhere (config keys, output rows)
#   ticker         GBP LSE trading line, yfinance form ("XDEW.L")
#   name           human label
#   isin           ISIN (verify before relying on it)
#   ter            ongoing charge, decimal (0.0015 = 0.15%)
#   accumulating   true if an Acc share class (preferred)
#   sleeve         logical sleeve for reporting / sleeve-level caps
#   role           one-line description of why it is here
#   isa_eligible   may be held in the ISA (Portfolio A)
#   sipp_eligible  may be held in the SIPP (Portfolio B). As of 2026-07 the SIPP
#                  is with INTERACTIVE INVESTOR, whose whole-of-market permitted
#                  list covers UCITS ETFs, investment trusts, funds and
#                  physically-backed ETCs, so the Trading 212 exclusions that
#                  originally qualified these flags no longer bind.
#   proxy          longer-history series for covariance estimation when the
#                  fund itself is young (see [proxy.*] tables below).
#
# TERs / ISINs / eligibility flags below are the candidate-brief values and
# MUST be reconciled against the verification table in
# report/UNIVERSE_VERIFICATION.md before the weights are trusted.
# ============================================================================

